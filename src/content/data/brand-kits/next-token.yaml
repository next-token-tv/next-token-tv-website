# Delivery metadata derived from next-token/assets/brand/README.md.
# Logo and VI source authority remains in the sibling next-token repository.
brand: next-token
preview: /assets/brand-kit/logo-next-token.svg
mediaLockups:
  - name:
      zh-Hans: 单行长条版
      en: Single-line lockup
    light: /assets/brand-kit/next-token-media-lockup-inline.svg
    dark: /assets/brand-kit/next-token-media-lockup-inline-dark.svg
    width: 559
    height: 108
  - name:
      zh-Hans: 双行组合版
      en: Stacked lockup
    light: /assets/brand-kit/next-token-media-lockup.svg
    dark: /assets/brand-kit/next-token-media-lockup-dark.svg
    width: 357
    height: 108
  - name:
      zh-Hans: 双行组合版 · 四位主理人
      en: Stacked lockup · Four co-hosts
    light: /assets/brand-kit/next-token-media-lockup-hosts.svg
    dark: /assets/brand-kit/next-token-media-lockup-hosts-dark.svg
    width: 469
    height: 108
  - name:
      zh-Hans: 单行长条版 · 四位主理人
      en: Single-line lockup · Four co-hosts
    light: /assets/brand-kit/next-token-media-lockup-inline-hosts.svg
    dark: /assets/brand-kit/next-token-media-lockup-inline-hosts-dark.svg
    width: 671
    height: 108
description:
  zh-Hans: 为市场合作、媒体报道与节目推荐准备的官方资料：主品牌与旗舰节目的多种长度介绍、可下载 Logo、品牌色及名称规范。
  en: 'Official resources for partners, press, and podcast recommendations: introductions to the brand and its flagship show in three lengths, downloadable logos, colors, and naming guidance.'
downloads:
  - href: /assets/brand-kit/logo-next-token.svg
    format: SVG
    size: 1024
    use:
      zh-Hans: 矢量图 · 可自由缩放
      en: Vector artwork · scalable
  - href: /assets/brand-kit/logo-next-token-3000.png
    format: PNG
    size: 3000
    use:
      zh-Hans: 高分辨率方形图片
      en: High-resolution square image
  - href: /assets/brand-kit/logo-next-token-1280.png
    format: PNG
    size: 1280
    use:
      zh-Hans: 中等尺寸方形图片
      en: Medium square image
  - href: /assets/brand-kit/logo-next-token.png
    format: PNG
    size: 1024
    use:
      zh-Hans: 标准方形图片
      en: Standard square image
  - href: /assets/brand-kit/logo-next-token-960.jpg
    format: JPG
    size: 960
    use:
      zh-Hans: 通用方形图片
      en: General-purpose square image
  - href: /assets/brand-kit/logo-next-token-512.png
    format: PNG
    size: 512
    use:
      zh-Hans: 小尺寸方形图片
      en: Small square image
# Color names and values resolve from the shared website palette.
colors:
  - --paper
  - --ink
  - --signal
  - --sky
  - --gold
  - --white
  - --surface
  - --muted
typeface: League Spartan
weight: Black / 900
