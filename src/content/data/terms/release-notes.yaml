name:
  zh-Hans: 版本说明
  en: Release Notes
summary:
  zh-Hans: 版本说明（release notes）是随每次软件发布向用户说明新增功能、变更、修复与已知事项的文档，常见形式包括 changelog 与 GitHub Release 页面。
  en: Release notes are documents shipped with each software release telling users what was added, changed, fixed and still broken. Common forms include a changelog and GitHub Release pages.
aliases:
  - release notes
  - changelog
  - 更新日志
status: published
lastVerifiedAt: '2026-10-11'
