name:
  zh-Hans: A/B 测试
  en: A/B Testing
summary:
  zh-Hans: 'A/B 测试是一种对照实验方法：把用户或流量随机分成两组，分别体验不同版本，再依据预先选定的量化指标判断哪个版本效果更好。'
  en: 'A/B testing is a controlled experiment method: users or traffic are randomly split into groups that experience different variants, and a metric chosen in advance decides which variant performs better.'
aliases:
  - A/B Test
  - AB 测试
  - Split Testing
status: published
