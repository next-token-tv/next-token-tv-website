name:
  zh-Hans: 计算机图形（CG）
  en: Computer Graphics (CG)
summary:
  zh-Hans: 计算机图形（CG）指用计算机创建、处理和呈现图形与影像的技术。在影视语境中，“CG 动画”通常指用这类技术制作的动画。
  en: Computer graphics (CG) covers techniques for creating, manipulating, and displaying images with computers. In film, “CG animation” refers to animation made using these techniques.
