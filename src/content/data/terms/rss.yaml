      zh-Hans: 'RSS Advisory Board：RSS 2.0 规范'
      en: 'RSS Advisory Board: RSS 2.0 Specification'
    href: https://www.rssboard.org/rss-specification
  - label:
      zh-Hans: 'IETF RFC 4287：Atom 联合格式'
      en: 'IETF RFC 4287: The Atom Syndication Format'
    href: https://www.rfc-editor.org/rfc/rfc4287
lastVerifiedAt: '2026-10-11'
