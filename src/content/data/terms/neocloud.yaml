      zh-Hans: "SemiAnalysis：AI Neocloud Playbook and Anatomy（2024）"
      en: "SemiAnalysis: AI Neocloud Playbook and Anatomy (2024)"
    href: https://semianalysis.substack.com/p/ai-neocloud-playbook-and-anatomy
lastVerifiedAt: '2026-10-11'
