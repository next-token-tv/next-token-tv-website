name:
  zh-Hans: 每秒词元数（TPS）
  en: Tokens per Second (TPS)
summary:
  zh-Hans: 每秒词元数（TPS）是衡量语言模型生成速度的指标，表示模型每秒输出多少个词元，通常统计首词元之后的稳定生成速度。数值越高，文本出现得越快。
  en: Tokens per second (TPS) measures how fast a language model generates text — the number of tokens it outputs per second, usually counted after the first token arrives. Higher values mean text appears faster.
aliases:
  - "TPS"
  - "每秒词元数"
  - "Tokens per Second"
