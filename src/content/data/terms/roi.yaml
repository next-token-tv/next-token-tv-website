name:
  zh-Hans: 投资回报率（ROI）
  en: Return on Investment (ROI)
summary:
  zh-Hans: 投资回报率（ROI）是衡量某笔投入赚回多少的比率指标，通常用收益与成本之差除以成本、以百分比表示。它的口径灵活，可用于一笔广告投放、一台设备，也可用于整体项目。
  en: Return on investment (ROI) is a ratio that expresses how much a given outlay earned back, usually computed as net gain divided by cost and quoted as a percentage. Its scope is flexible — it can be applied to a single ad campaign, a piece of equipment, or an entire project.
aliases:
