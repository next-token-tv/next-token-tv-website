name:
  zh-Hans: 通用人工智能（AGI）
  en: Artificial General Intelligence (AGI)
summary:
  zh-Hans: 通用人工智能指能在广泛认知任务上达到人类水平、并把能力迁移到陌生领域的假想 AI 系统。它是研究界追求的目标，尚无公认已实现的系统。
  en: Artificial general intelligence is a hypothetical AI system that matches human performance across a broad range of cognitive tasks and transfers its skills to unfamiliar domains. It remains a research goal with no widely acknowledged implementation.
