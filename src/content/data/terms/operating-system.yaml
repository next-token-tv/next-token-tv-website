name:
  zh-Hans: 操作系统（OS）
  en: Operating System (OS)
summary:
  zh-Hans: 操作系统（OS）是管理计算机硬件资源并为应用程序提供运行环境的系统软件，负责进程调度、内存管理、文件系统与设备驱动等基础工作。Windows、macOS、Linux 都是常见的操作系统。
  en: An operating system (OS) is system software that manages a computer's hardware resources and provides the environment in which applications run, handling process scheduling, memory management, file systems and device drivers. Windows, macOS and Linux are common examples.
aliases:
  - "OS"
  - "操作系统"
  - "Operating System"
