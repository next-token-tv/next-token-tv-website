name:
  zh-Hans: 产品与市场契合（PMF）
  en: Product-Market Fit (PMF)
summary:
  zh-Hans: 产品与市场契合（PMF）指产品切实满足了一个真实且足够大的市场需求、由需求拉动增长的状态。这一概念因投资人马克·安德森的文章而广为流传。
  en: Product-market fit (PMF) is the state in which a product genuinely satisfies a real, sizable market need, so that demand pulls the product forward. The concept was popularized by investor Marc Andreessen.
