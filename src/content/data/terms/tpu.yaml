name:
  zh-Hans: 张量处理单元（TPU）
  en: Tensor Processing Unit (TPU)
summary:
  zh-Hans: 张量处理单元（TPU）是 Google 为机器学习工作负载设计的专用集成电路（ASIC），用于加速神经网络中的张量运算。它以矩阵乘法等核心计算为设计中心，主要经由 Google Cloud 以云服务形式提供。
  en: A tensor processing unit (TPU) is an application-specific integrated circuit (ASIC) designed by Google for machine learning workloads, built to accelerate tensor operations in neural networks. Centered on computations such as matrix multiplication, it is offered primarily as a service through Google Cloud.
aliases:
