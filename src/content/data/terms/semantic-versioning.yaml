name:
  zh-Hans: 语义化版本（SemVer）
  en: Semantic Versioning (SemVer)
summary:
  zh-Hans: 语义化版本（SemVer）是版本号规范，格式为"主版本号.次版本号.修订号"（如 2.4.1）：主版本号变更表示不兼容的 API 变更，次版本号表示向后兼容的新功能，修订号表示向后兼容的问题修复。
  en: 'Semantic Versioning (SemVer) is a versioning scheme with the format major.minor.patch (for example 2.4.1): a major bump signals an incompatible API change, a minor bump adds backward-compatible functionality, and a patch bump fixes backward-compatible bugs.'
aliases:
  - "SemVer"
  - "语义化版本号"
  - "语义化版本"
  - "Semantic Versioning"
status: published
lastVerifiedAt: '2026-10-11'
sources:
