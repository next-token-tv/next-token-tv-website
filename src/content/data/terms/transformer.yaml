name:
  zh-Hans: Transformer
  en: Transformer
summary:
  zh-Hans: Transformer 是一种以自注意力机制为核心的神经网络架构，由论文《Attention Is All You Need》提出，用于处理文本等序列数据，是大语言模型的基础架构。
  en: The transformer is a neural network architecture built on self-attention, introduced in the paper "Attention Is All You Need" for processing sequences such as text; it is the architecture underlying large language models.
