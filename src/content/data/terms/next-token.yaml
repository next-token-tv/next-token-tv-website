name:
  zh-Hans: 下一个词元
  en: Next Token
summary:
  zh-Hans: 下一个词元指语言模型自回归生成中即将输出的后继文本单位：模型依据已有上下文计算各候选词元的概率分布，从中选出一个接在序列后面。预测下一个词元也是语言模型预训练的核心目标。
  en: 'Next-token prediction is how a language model generates text: given the existing context, the model computes a probability distribution over candidate tokens, selects one to append to the sequence, and repeats. Predicting the next token is also the core pretraining objective of language models.'
aliases: []
