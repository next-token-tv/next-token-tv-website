      en: 'POSIX: Shell Command Language'
    href: https://pubs.opengroup.org/onlinepubs/9799919799/utilities/V3_chap02.html
  - label:
      zh-Hans: Microsoft Learn：Windows 命令参考
      en: 'Microsoft Learn: Windows Commands Reference'
    href: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/windows-commands
