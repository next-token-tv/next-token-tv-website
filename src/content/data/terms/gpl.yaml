summary:
  zh-Hans: GPL 是自由软件基金会发布的 Copyleft 许可证，允许任何人自由使用、修改和再发布软件，但要求分发衍生作品时以相同许可证授权并提供源代码。常见版本为 GPLv2 与 GPLv3。
  en: "The GPL is a copyleft license published by the Free Software Foundation: anyone may use, modify and redistribute the software, but derivative works must be distributed under the same license with source code available. Common versions are GPLv2 and GPLv3."
