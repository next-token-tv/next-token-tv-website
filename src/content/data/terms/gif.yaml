name:
  zh-Hans: GIF
  en: GIF
summary:
  zh-Hans: GIF（Graphics Interchange Format）是一种位图图像格式，由 CompuServe 于 1987 年发布，使用 LZW 无损压缩，每帧最多 256 色，并支持逐帧动画。当前通行的版本由 1989 年的 GIF89a 规范定义。
  en: GIF (Graphics Interchange Format) is a bitmap image format released by CompuServe in 1987, using lossless LZW compression, at most 256 colors per frame, with support for frame-by-frame animation. The version in common use is defined by the 1989 GIF89a specification.
aliases:
