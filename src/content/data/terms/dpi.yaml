name:
  zh-Hans: '每英寸点数（DPI）'
  en: 'Dots per Inch (DPI)'
summary:
  zh-Hans: 'DPI 是每英寸点数的缩写。在鼠标语境中，它通常表示移动灵敏度：相同物理移动距离下，更高设置会让指针移动得更多。'
  en: 'DPI stands for dots per inch. For a mouse, it commonly describes sensitivity: a higher setting produces more pointer movement for the same physical travel.'
aliases:
  - 'DPI'
  - '每英寸点数'
status: 'published'
lastVerifiedAt: '2026-10-20'
