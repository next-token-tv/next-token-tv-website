name:
  zh-Hans: 系统提示词
  en: System Prompt
summary:
  zh-Hans: 系统提示词（system prompt）是开发者或产品在对话开始前注入的指令，用来设定模型的角色、规则与输出约束，通常对终端用户不可见。
  en: A system prompt is an instruction injected by the developer or product before a conversation begins, setting the model's role, rules and output constraints; it is typically invisible to end users.
aliases:
  - System Message
  - 系统指令
status: published
