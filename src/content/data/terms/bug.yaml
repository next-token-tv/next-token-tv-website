name:
  zh-Hans: 软件缺陷
  en: Bug
summary:
  zh-Hans: 软件缺陷（bug）指程序中导致行为与预期不符、出错或崩溃的缺陷。这个词在工程语境中早有使用，1947 年哈佛 Mark II 计算机中发现飞蛾的记录使其广为流传。
  en: A bug is a defect in a program that causes behavior to deviate from what is expected, produce errors or crash. The word was already in engineering use, but the 1947 record of a moth found in the Harvard Mark II made it widespread.
aliases:
  - bug
  - 程序错误
  - 缺陷
status: published
lastVerifiedAt: '2026-10-11'
