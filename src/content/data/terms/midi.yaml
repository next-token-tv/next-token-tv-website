name:
  zh-Hans: 乐器数字接口（MIDI）
  en: Musical Instrument Digital Interface (MIDI)
summary:
  zh-Hans: 乐器数字接口（MIDI）是电子乐器、计算机与其他设备之间交换音符、力度、控制指令等演奏信息的协议，1983 年发布，由 MIDI 协会维护。MIDI 传输的是指令而非音频本身，音色由接收设备决定。
  en: Musical Instrument Digital Interface (MIDI) is a protocol for electronic instruments, computers and other devices to exchange performance data such as notes, velocity and control messages, released in 1983 and maintained by the MIDI Association. MIDI carries instructions, not audio itself; the sound is produced by the receiving device.
aliases:
