name:
  zh-Hans: 可缩放矢量图形（SVG）
  en: Scalable Vector Graphics (SVG)
summary:
  zh-Hans: 可缩放矢量图形（SVG）是 W3C 制定的基于 XML 的矢量图像格式，用数学描述形状、路径与文字，可无损缩放到任意尺寸。与按像素存储的位图格式（如 GIF）相对，SVG 常用于图标与插图。
  en: Scalable Vector Graphics (SVG) is an XML-based vector image format defined by the W3C, describing shapes, paths and text mathematically so images scale to any size without loss. Unlike pixel-based bitmap formats such as GIF, SVG is commonly used for icons and illustrations.
aliases:
